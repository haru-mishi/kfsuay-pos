<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KFSuay Register — POS Concurrency Demo</title>
<!--
  DIRECTION CONTRACT (KFSuay Register — KFC-coded redesign)
  THESIS: "KFSuay" is a pun (KFC + Thai "suay"/unlucky) — the register should
  genuinely feel like KFC by color/weight/motif, never by copying KFC's actual
  logo, wordmark, or the Colonel's likeness. Refuses both the earlier abstract
  demo-tool worlds and the generic rainbow-tile register that came after them.
  OWN-WORLD: Red/white/near-black QSR register — one brand red carries the whole
  identity (The One-Red Rule), heavy-weight display type, white cards with a red
  top stripe, original icons re-inked red/black, a subtle diagonal stripe texture
  on the flagship bucket tile. "Declined" status moves off red to near-black so it
  never competes with the brand color.
  STORY: Same cart → CONFIRM ORDER → QR-receipt flow as before, now in KFC dress.
  The concurrency-demo controls (the actual engineering point) are fully hidden
  behind a small neutral icon rather than standing on screen — a deliberate first
  for this project, confirmed with the user since it's still reachable, not gone.
  FIRST VIEWPORT: solid red header (branding + live clock), 2x2 item-tile grid
  left/center, cart + receipt/order-log panel right, a small gray icon
  bottom-right (not red — deliberately unbranded) toggling the hidden demo panel.
  FORM: real-POS register, user-pinned KFC-coded redesign (brief overrides taste).
-->
<style>
  :root {
    --bg: #faf5ec;
    --surface: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --border: #ecdfc9;
    --red: #d81f26;
    --red-deep: #a5161b;
    --success: #1f9d55;
    --declined: #1a1a1a;
    --demo-bg: #1c2430;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }

  body { display: flex; flex-direction: column; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--red);
    box-shadow: 0 4px 14px rgba(26, 26, 26, 0.15);
    padding: 16px 28px;
    z-index: 1;
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .brand svg { width: 30px; height: 30px; }
  header h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.01em; margin: 0; color: #fff; }
  header .branch { font-size: 0.85rem; font-weight: 600; color: rgba(255, 255, 255, 0.8); margin-left: 8px; }
  #clock { font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, 0.85); }

  main {
    flex: 1;
    display: flex;
    gap: 24px;
    padding: 24px 28px;
    min-height: 0;
  }

  .tiles {
    flex: 1.3;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 18px;
  }

  .tile {
    border: none;
    border-radius: 14px;
    background: var(--red);
    color: #fff;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-start;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(26, 26, 26, 0.16);
    transition: box-shadow 0.15s, transform 0.08s, opacity 0.2s;
    font-family: var(--sans);
    text-align: left;
  }
  .tile:active { box-shadow: 0 2px 6px rgba(26, 26, 26, 0.2); transform: scale(0.98); }
  .tile .dish-icon { width: 44px; height: 44px; }
  .tile .name { font-size: 1.05rem; font-weight: 800; margin-top: 10px; color: #fff; }
  .tile .price {
    display: inline-block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--red-deep);
    background: #fff;
    padding: 3px 10px;
    border-radius: 999px;
    margin-top: 6px;
  }
  .tile .badge {
    align-self: flex-end;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--red-deep);
    background: #fff;
    padding: 4px 10px;
    border-radius: 999px;
    margin-top: 10px;
  }
  .tile .badge.sold-out { background: var(--declined); color: #fff; }
  .tile.sold-out { opacity: 0.65; }

  /* ponytail: flagship item only — a deeper-red bucket-liner stripe texture,
     the one deliberate KFC-motif flourish, not applied to every tile so it
     stays a signal rather than wallpaper. */
  .tile-bucket {
    background: repeating-linear-gradient(45deg, var(--red) 0 16px, var(--red-deep) 16px 20px);
  }

  .side {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
  }

  .cart {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(20, 24, 33, 0.08);
    padding: 16px 18px;
    flex-shrink: 0;
  }
  .cart h2 {
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .cart-empty { font-size: 0.85rem; color: var(--muted); padding: 4px 0 8px; }
  .cart-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 0;
    font-size: 0.9rem;
  }
  .cart-line .qty-btn {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    font-weight: 700;
    cursor: pointer;
    line-height: 1;
  }
  .cart-line .cart-name { flex: 1; font-weight: 600; }
  .cart-line .cart-sub { color: var(--muted); font-variant-numeric: tabular-nums; }
  .cart-total {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    padding: 10px 0 12px;
    border-top: 1px solid var(--border);
    margin-top: 6px;
  }
  .confirm-btn {
    width: 100%;
    font-family: var(--sans);
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px;
    cursor: pointer;
  }
  .confirm-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .receipt {
    flex: 1;
    min-height: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(20, 24, 33, 0.08);
    display: flex;
    flex-direction: column;
  }
  .receipt h2 {
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding: 16px 18px 8px;
    margin: 0;
  }
  .receipt-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 18px 160px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .receipt-summary {
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 12px;
    border-radius: 8px;
    background: #f2f4f7;
    border: 1px solid var(--border);
  }
  .receipt-line {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    font-size: 0.9rem;
  }
  .receipt-line .desc { display: flex; flex-direction: column; }
  .receipt-line .item { font-weight: 600; }
  .receipt-line .time { color: var(--muted); font-size: 0.75rem; }
  .receipt-line .status { font-weight: 700; font-size: 0.8rem; white-space: nowrap; }
  .receipt-line .status.accepted { color: var(--success); }
  .receipt-line .status.rejected { color: var(--declined); }

  /* ponytail: plain, unbranded (not red) so it reads as a settings
     affordance, never as part of the register's own feature set. */
  .demo-toggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 1rem;
    box-shadow: 0 4px 14px rgba(26, 26, 26, 0.12);
    cursor: pointer;
  }

  .demo-panel {
    position: fixed;
    bottom: 64px;
    right: 20px;
    background: var(--demo-bg);
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(20, 24, 33, 0.25);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 190px;
  }
  .demo-panel.hidden { display: none; }
  .demo-panel .label {
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    color: #8a93a3;
    font-weight: 700;
  }
  .demo-btn {
    font-family: var(--sans);
    font-size: 0.8rem;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 10px 14px;
    cursor: pointer;
  }
  .demo-btn.rush { background: var(--red); color: #fff; }
  .demo-btn.reset { background: #2c3444; color: #fff; }
  .demo-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  dialog#receiptModal {
    border: none;
    border-radius: 16px;
    padding: 0;
    box-shadow: 0 12px 40px rgba(20, 24, 33, 0.3);
    width: min(360px, 90vw);
  }
  dialog#receiptModal::backdrop { background: rgba(20, 24, 33, 0.45); }
  .receipt-modal-inner { padding: 24px; text-align: center; font-family: var(--sans); }
  .receipt-modal-inner h3 { margin: 0 0 4px; font-size: 1.1rem; }
  .receipt-modal-inner .ref { color: var(--muted); font-size: 0.8rem; margin-bottom: 16px; }
  .qr-holder { display: flex; justify-content: center; margin-bottom: 16px; }
  .qr-holder svg { width: 180px; height: 180px; }
  .receipt-text {
    text-align: left;
    font-size: 0.85rem;
    background: var(--bg);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .receipt-text .rline { display: flex; justify-content: space-between; padding: 3px 0; }
  .receipt-text .rtotal { display: flex; justify-content: space-between; font-weight: 700; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; }
  .declined-note { color: var(--declined); font-size: 0.8rem; margin-bottom: 12px; }
  .close-btn {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 0.85rem;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 24px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M16 24h32l-4.5 32a4 4 0 0 1-4 3.5H24.5a4 4 0 0 1-4-3.5L16 24z" fill="#fff"/>
        <ellipse cx="32" cy="24" rx="16" ry="4" fill="#fff"/>
        <path d="M19 22q13-16 26 0" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <div><h1 style="display:inline">KFSuay</h1><span class="branch">Bangkok Register</span></div>
    </div>
    <div id="clock">--:--:--</div>
  </header>

  <main>
    <div class="tiles" id="tiles"></div>
    <div class="side">
      <div class="cart">
        <h2>CURRENT ORDER</h2>
        <div id="cartLines"></div>
        <div class="cart-total"><span>TOTAL</span><span id="cartTotal">฿0</span></div>
        <button class="confirm-btn" id="confirmBtn" disabled>CONFIRM ORDER</button>
      </div>
      <div class="receipt">
        <h2>ORDER LOG</h2>
        <div class="receipt-list" id="receiptList"></div>
      </div>
    </div>
  </main>

  <button class="demo-toggle" id="demoToggle" aria-label="Demo controls" title="Demo controls">⚙</button>
  <div class="demo-panel hidden" id="demoPanel">
    <div class="label">DEMO CONTROLS</div>
    <button class="demo-btn rush" id="rushBtn">SIMULATE RUSH ×30</button>
    <button class="demo-btn reset" id="resetBtn">RESET STOCK</button>
  </div>

  <dialog id="receiptModal">
    <div class="receipt-modal-inner">
      <h3>Order Confirmed</h3>
      <div class="ref" id="modalRef"></div>
      <div class="qr-holder" id="qrHolder"></div>
      <div class="receipt-text" id="receiptText"></div>
      <div class="declined-note" id="declinedNote" style="display:none"></div>
      <button class="close-btn" id="closeModalBtn">CLOSE</button>
    </div>
  </dialog>

<script src="vendor/qrcode.js"></script>
<script>
  const BRANCH_ID = 1;
  const BUCKET_ITEM_ID = 1;

  // ponytail: original flat-illustration icons, one shape group per item —
  // no real food photography exists for these dishes, so nothing claims to
  // be a photo. Simple primitive shapes (ellipse/rect/path), not full
  // illustrations, since that's what a hand-authored SVG icon set needs.
  // ponytail: re-inked white/black duotone for solid-red tiles — same
  // shapes as before, just recolored for the new world.
  const ICONS = {
    1: `<svg class="dish-icon" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M16 24h32l-4.5 32a4 4 0 0 1-4 3.5H24.5a4 4 0 0 1-4-3.5L16 24z" fill="#fff"/>
      <ellipse cx="32" cy="24" rx="16" ry="4" fill="#fff"/>
      <path d="M19 22q13-16 26 0" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="25" cy="18" r="6" fill="#1a1a1a"/>
      <circle cx="34" cy="15" r="6.5" fill="#1a1a1a"/>
      <circle cx="41" cy="19" r="5.5" fill="#1a1a1a"/>
    </svg>`,
    2: `<svg class="dish-icon" viewBox="0 0 64 64" aria-hidden="true">
      <ellipse cx="26" cy="26" rx="14" ry="12" fill="#fff" transform="rotate(-25 26 26)"/>
      <rect x="32" y="34" width="7" height="20" rx="3.5" fill="#fff" transform="rotate(-25 32 34)"/>
      <path d="M46 16c4 0 7 3 7 7 0 5-4 9-9 10 0-4 0-8 2-11 0-2-1-4 0-6z" fill="#1a1a1a"/>
      <circle cx="49" cy="30" r="1.6" fill="#1a1a1a"/>
      <circle cx="53" cy="27" r="1.6" fill="#1a1a1a"/>
      <circle cx="52" cy="34" r="1.6" fill="#1a1a1a"/>
    </svg>`,
    3: `<svg class="dish-icon" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="16" y="28" width="32" height="22" rx="3" fill="#fff"/>
      <path d="M16 28l7-12h18l7 12z" fill="#1a1a1a" opacity="0.85"/>
      <rect x="29" y="28" width="6" height="22" fill="#1a1a1a" opacity="0.3"/>
    </svg>`,
    4: `<svg class="dish-icon" viewBox="0 0 64 64" aria-hidden="true">
      <ellipse cx="32" cy="30" rx="16" ry="14" fill="#fff"/>
      <circle cx="20" cy="20" r="7" fill="#1a1a1a"/>
      <ellipse cx="24" cy="44" rx="4" ry="9" fill="#1a1a1a" transform="rotate(-10 24 44)"/>
      <ellipse cx="40" cy="44" rx="4" ry="9" fill="#1a1a1a" transform="rotate(10 40 44)"/>
      <path d="M40 22c4-2 8 0 8 4s-4 5-8 3z" fill="#fff" opacity="0.85"/>
    </svg>`,
  };

  const MENU = [
    { id: 1, name: 'ALL IN ONE BUCKET', price: 199, trackStock: true },
    { id: 2, name: 'Chick N Share Zabb', price: 89 },
    { id: 3, name: 'The Box Signature', price: 159 },
    { id: 4, name: 'Suk Lon Jai', price: 619 },
  ];
  const MENU_BY_ID = Object.fromEntries(MENU.map((m) => [m.id, m]));

  const tilesEl = document.getElementById('tiles');
  const cartLinesEl = document.getElementById('cartLines');
  const cartTotalEl = document.getElementById('cartTotal');
  const confirmBtn = document.getElementById('confirmBtn');
  const receiptList = document.getElementById('receiptList');
  const rushBtn = document.getElementById('rushBtn');
  const resetBtn = document.getElementById('resetBtn');
  const demoToggle = document.getElementById('demoToggle');
  const demoPanel = document.getElementById('demoPanel');
  const clockEl = document.getElementById('clock');
  const modal = document.getElementById('receiptModal');
  const modalRef = document.getElementById('modalRef');
  const qrHolder = document.getElementById('qrHolder');
  const receiptText = document.getElementById('receiptText');
  const declinedNote = document.getElementById('declinedNote');
  const closeModalBtn = document.getElementById('closeModalBtn');

  const tileEls = {};
  const cart = {}; // itemId -> quantity

  function renderTiles() {
    MENU.forEach((item) => {
      const btn = document.createElement('button');
      btn.className = `tile ${item.id === BUCKET_ITEM_ID ? 'tile-bucket' : ''}`;
      btn.innerHTML = `
        ${ICONS[item.id]}
        <div>
          <div class="name">${item.name}</div>
          <div class="price">฿${item.price}</div>
        </div>
        ${item.trackStock ? '<span class="badge" data-badge></span>' : ''}
      `;
      btn.addEventListener('click', () => addToCart(item.id));
      tilesEl.appendChild(btn);
      tileEls[item.id] = btn;
    });
  }

  function addToCart(itemId) {
    cart[itemId] = (cart[itemId] || 0) + 1;
    renderCart();
  }

  function decrementCart(itemId) {
    if (!cart[itemId]) return;
    cart[itemId] -= 1;
    if (cart[itemId] <= 0) delete cart[itemId];
    renderCart();
  }

  function renderCart() {
    const ids = Object.keys(cart);
    if (ids.length === 0) {
      cartLinesEl.innerHTML = '<div class="cart-empty">Tap a menu item to start an order.</div>';
      confirmBtn.disabled = true;
      cartTotalEl.textContent = '฿0';
      return;
    }
    let total = 0;
    cartLinesEl.innerHTML = '';
    ids.forEach((idStr) => {
      const id = Number(idStr);
      const qty = cart[id];
      const item = MENU_BY_ID[id];
      const subtotal = qty * item.price;
      total += subtotal;
      const line = document.createElement('div');
      line.className = 'cart-line';
      line.innerHTML = `
        <button class="qty-btn" data-decrement="${id}">−</button>
        <span class="cart-name">${qty}× ${item.name}</span>
        <span class="cart-sub">฿${subtotal}</span>
      `;
      cartLinesEl.appendChild(line);
    });
    cartLinesEl.querySelectorAll('[data-decrement]').forEach((btn) => {
      btn.addEventListener('click', () => decrementCart(Number(btn.dataset.decrement)));
    });
    cartTotalEl.textContent = `฿${total}`;
    confirmBtn.disabled = false;
  }

  function setStockBadge(quantity) {
    const btn = tileEls[BUCKET_ITEM_ID];
    const badge = btn.querySelector('[data-badge]');
    if (quantity <= 0) {
      badge.textContent = 'SOLD OUT';
      badge.classList.add('sold-out');
      btn.classList.add('sold-out');
    } else {
      badge.textContent = `${quantity} left`;
      badge.classList.remove('sold-out');
      btn.classList.remove('sold-out');
    }
  }

  function addReceiptLine(item, qty, accepted) {
    const line = document.createElement('div');
    line.className = 'receipt-line';
    const time = new Date().toLocaleTimeString();
    line.innerHTML = `
      <div class="desc">
        <span class="item">${qty}× ${item.name}</span>
        <span class="time">${time} · ฿${qty * item.price}</span>
      </div>
      <span class="status ${accepted ? 'accepted' : 'rejected'}">${accepted ? 'ACCEPTED' : 'SOLD OUT'}</span>
    `;
    receiptList.insertBefore(line, receiptList.firstChild);
    // ponytail: cap comfortably above one rush burst (30) so a single
    // SIMULATE RUSH never pushes its own accepted lines out of view.
    while (receiptList.children.length > 40) {
      receiptList.removeChild(receiptList.lastChild);
    }
  }

  async function placeOrder(item, qty) {
    let ok = false;
    let remaining = null;
    try {
      const res = await fetch(`/branches/${BRANCH_ID}/orders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: item.id, quantity: qty }),
      });
      ok = res.ok;
      if (ok) {
        const data = await res.json();
        remaining = data.remaining_stock;
      }
    } catch (e) {
      ok = false;
    }
    if (ok && item.trackStock) setStockBadge(remaining);
    addReceiptLine(item, qty, ok);
    return { item, qty, ok };
  }

  async function syncStock() {
    try {
      const res = await fetch(`/branches/${BRANCH_ID}/items/${BUCKET_ITEM_ID}/stock`);
      if (res.ok) {
        const data = await res.json();
        setStockBadge(data.quantity_available);
      }
    } catch (e) {
      // API not reachable yet; badge stays blank until a real order syncs it
    }
  }

  function showReceiptModal(fulfilled, declined) {
    const orderRef = Math.floor(Date.now() % 100000).toString().padStart(5, '0');
    const total = fulfilled.reduce((sum, l) => sum + l.qty * l.item.price, 0);
    const timestamp = new Date().toLocaleString();

    let text = `KFSuay Bangkok\nOrder #${orderRef}\n`;
    fulfilled.forEach((l) => { text += `${l.qty}x ${l.item.name}  ฿${l.qty * l.item.price}\n`; });
    text += `---\nTOTAL: ฿${total}\n${timestamp}`;

    modalRef.textContent = `Order #${orderRef} · ${timestamp}`;
    qrHolder.innerHTML = '';
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    qrHolder.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2 });

    receiptText.innerHTML = fulfilled
      .map((l) => `<div class="rline"><span>${l.qty}× ${l.item.name}</span><span>฿${l.qty * l.item.price}</span></div>`)
      .join('') + `<div class="rtotal"><span>TOTAL</span><span>฿${total}</span></div>`;

    if (declined.length > 0) {
      declinedNote.style.display = 'block';
      declinedNote.textContent = `Unavailable, removed from order: ${declined.map((l) => `${l.qty}× ${l.item.name}`).join(', ')} (SOLD OUT)`;
    } else {
      declinedNote.style.display = 'none';
    }

    modal.showModal();
  }

  confirmBtn.addEventListener('click', async () => {
    confirmBtn.disabled = true;
    const lines = Object.entries(cart).map(([id, qty]) => ({ item: MENU_BY_ID[Number(id)], qty }));
    cart && Object.keys(cart).forEach((k) => delete cart[k]);
    renderCart();

    const results = await Promise.all(lines.map((l) => placeOrder(l.item, l.qty)));
    const fulfilled = results.filter((r) => r.ok);
    const declined = results.filter((r) => !r.ok);

    if (fulfilled.length > 0) {
      showReceiptModal(fulfilled, declined);
    } else {
      const banner = document.createElement('div');
      banner.className = 'receipt-summary';
      banner.style.color = 'var(--declined)';
      banner.textContent = 'Order could not be placed — item(s) sold out.';
      receiptList.insertBefore(banner, receiptList.firstChild);
    }
  });

  closeModalBtn.addEventListener('click', () => modal.close());

  demoToggle.addEventListener('click', () => demoPanel.classList.toggle('hidden'));

  rushBtn.addEventListener('click', async () => {
    rushBtn.disabled = true;
    const bucket = MENU_BY_ID[BUCKET_ITEM_ID];
    const requests = [];
    for (let i = 0; i < 30; i++) requests.push(placeOrder(bucket, 1));
    const results = await Promise.all(requests);
    const accepted = results.filter((r) => r.ok).length;
    const rejected = results.length - accepted;
    // rejected requests wait on the row lock and resolve after accepted
    // ones, so newest-first insertion buries the accepted lines below the
    // rejected ones — a summary line keeps the actual result visible
    // without scrolling.
    const summary = document.createElement('div');
    summary.className = 'receipt-summary';
    summary.textContent = `RUSH COMPLETE — ${accepted} ACCEPTED / ${rejected} SOLD OUT`;
    receiptList.insertBefore(summary, receiptList.firstChild);
    rushBtn.disabled = false;
  });

  resetBtn.addEventListener('click', async () => {
    resetBtn.disabled = true;
    const res = await fetch('/admin/reset', { method: 'POST' });
    const data = await res.json();
    setStockBadge(data.quantity_available);
    resetBtn.disabled = false;
  });

  function tickClock() {
    clockEl.textContent = new Date().toLocaleTimeString();
  }

  renderTiles();
  renderCart();
  syncStock();
  tickClock();
  setInterval(tickClock, 1000);
</script>
</body>
</html>
