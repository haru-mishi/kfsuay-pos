<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 86 Board — KFSuay Concurrency Demo</title>
<!--
  DIRECTION CONTRACT (The 86 Board — redesign, replaces "Approach Control")
  THESIS: A concurrency race isn't a bar chart — it's a kitchen expo wheel where
  tickets fire or get 86'd; refuses both the generic load-test dashboard AND the
  prior direction's cold engineering-tool read (nothing on it said "restaurant").
  OWN-WORLD: Warm kitchen-at-night backdrop, kraft-paper ticket stubs clipped to a
  metal expo wheel, two stamp inks only — orange FIRED, red 86'D — chalkboard-style
  readout panel, rail-hardware toggle switches.
  STORY: Visitor fires a 30-ticket burst at the seeded Bangkok bucket (10 units),
  watches each ticket resolve live on the wheel, reads FIRED/86'D/STOCK on the
  chalkboard, sees the hub go "86'D — SOLD OUT" at zero, hits RESET to reopen.
  FIRST VIEWPORT: full-bleed circular expo wheel centered; chalkboard readout
  docked bottom-right; FIRE/RESET switches docked bottom-left.
  FORM: diner expo ticket wheel — user-picked replacement for the assigned radar
  direction, after the radar read as unrecognizable outside its own backstory.
-->
<style>
  :root {
    --board-bg: #170f0a;
    --board-panel: #12241a;
    --rail-metal: #4a3c2e;
    --ticket-paper: #f2e6c9;
    --stamp-fired: #ff8c1a;
    --stamp-86: #ff3b30;
    --chalk: #f4efe3;
    --chalk-dim: #7d9184;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(ellipse at 50% 42%, #2a1c0f 0%, var(--board-bg) 62%);
    color: var(--chalk);
    font-family: var(--mono);
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wheel {
    position: relative;
    width: min(70vmin, 640px);
    height: min(70vmin, 640px);
    border-radius: 50%;
    background: radial-gradient(circle at center, #24170a 0%, var(--board-bg) 100%);
    border: 6px solid var(--rail-metal);
    box-shadow:
      inset 0 0 0 2px #2c2013,
      0 8px 24px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  .spokes {
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background: repeating-conic-gradient(
      from 0deg,
      var(--rail-metal) 0deg 1.4deg,
      transparent 1.4deg 45deg
    );
    -webkit-mask-image: radial-gradient(circle, transparent 8%, black 9%, black 100%);
    mask-image: radial-gradient(circle, transparent 8%, black 9%, black 100%);
    animation: rotate 60s linear infinite;
    opacity: 0.7;
  }

  @keyframes rotate { to { transform: rotate(360deg); } }

  .hub {
    position: absolute;
    top: 50%; left: 50%;
    width: 26px; height: 26px;
    margin: -13px 0 0 -13px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6b5844, var(--rail-metal) 70%);
    border: 2px solid var(--stamp-fired);
    box-shadow: 0 0 6px rgba(255, 140, 26, 0.5), 0 2px 3px rgba(0, 0, 0, 0.6);
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .hub.closed {
    border-color: var(--stamp-86);
    box-shadow: 0 0 10px rgba(255, 59, 48, 0.7), 0 2px 3px rgba(0, 0, 0, 0.6);
  }

  .hub.pulse { animation: pulse 0.3s ease-out; }
  @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }

  .sold-out-label {
    position: absolute;
    top: calc(50% + 24px); left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: var(--stamp-86);
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
  }
  .sold-out-label.show { opacity: 1; }

  .ticket {
    position: absolute;
    top: 50%; left: 50%;
    width: 12px; height: 16px;
    margin: -8px 0 0 -6px;
    background: var(--ticket-paper);
    border-radius: 2px;
    clip-path: polygon(0 20%, 20% 0, 40% 20%, 60% 0, 80% 20%, 100% 0, 100% 100%, 0 100%);
    box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
    transform: translate(var(--x0), var(--y0));
    transition: transform 0.55s ease-out, background 0.25s, opacity 0.4s;
  }
  .ticket.inflight { animation: ticket-pulse 0.5s ease-in-out infinite alternate; }
  @keyframes ticket-pulse { from { opacity: 0.6; } to { opacity: 1; } }

  .ticket.enter.fired { transform: translate(0px, 0px) scale(0.55); background: var(--stamp-fired); opacity: 0.9; }
  .ticket.enter.eightysixed {
    transform: translate(var(--x1), var(--y1));
    background: var(--stamp-86);
    opacity: 0.6;
  }

  .readout-panel, .switch-panel {
    position: fixed;
    bottom: 24px;
    background: linear-gradient(165deg, #1a2f21, var(--board-panel) 45%);
    border: 2px solid var(--rail-metal);
    border-radius: 4px;
    padding: 16px 22px;
    display: flex;
    gap: 24px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 6px 16px rgba(0, 0, 0, 0.45);
  }

  .readout-panel::before, .readout-panel::after,
  .switch-panel::before, .switch-panel::after {
    content: "";
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6b5844, var(--rail-metal) 70%);
    top: 6px;
  }
  .readout-panel::before, .switch-panel::before { left: 6px; }
  .readout-panel::after, .switch-panel::after { right: 6px; }

  .readout-panel { right: 24px; }
  .switch-panel { left: 24px; gap: 16px; }

  .readout-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .readout-item .value {
    font-size: clamp(1.1rem, 2.4vw, 1.6rem);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--chalk);
  }
  .readout-item.alert .value { color: var(--stamp-86); }
  .readout-item .label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--chalk-dim);
  }

  .toggle {
    font-family: var(--mono);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    background: var(--board-bg);
    border: 1px solid var(--rail-metal);
    border-radius: 2px;
    padding: 12px 20px;
    cursor: pointer;
    transition: box-shadow 0.15s, transform 0.08s;
  }
  .toggle-fire { color: var(--stamp-86); }
  .toggle-reset { color: var(--chalk); }
  .toggle:hover { box-shadow: 0 0 8px rgba(255, 140, 26, 0.2); }
  .toggle:active { transform: translateY(2px); }
  .toggle:disabled { opacity: 0.35; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="wheel" id="scope">
    <div class="spokes"></div>
    <div class="hub" id="beacon"></div>
    <div class="sold-out-label" id="sectorLabel">86'D — SOLD OUT</div>
  </div>

  <div class="readout-panel">
    <div class="readout-item"><span class="value" id="clearedVal">0</span><span class="label">FIRED</span></div>
    <div class="readout-item"><span class="value" id="wavedVal">0</span><span class="label">86'D</span></div>
    <div class="readout-item" id="stockItem"><span class="value" id="stockVal">10</span><span class="label">STOCK</span></div>
  </div>

  <div class="switch-panel">
    <button class="toggle toggle-fire" id="fireBtn">FIRE ×30</button>
    <button class="toggle toggle-reset" id="resetBtn">RESET</button>
  </div>

<script>
  // ponytail: single fixed scenario (branch 1 / item 1, N=30) — matches the
  // seeded demo row demo_concurrency.py already proves; generalize only if a
  // second scenario is actually needed.
  const BRANCH_ID = 1, ITEM_ID = 1, N = 30, SEED_STOCK = 10;

  const scope = document.getElementById('scope');
  const beacon = document.getElementById('beacon');
  const sectorLabel = document.getElementById('sectorLabel');
  const clearedVal = document.getElementById('clearedVal');
  const wavedVal = document.getElementById('wavedVal');
  const stockVal = document.getElementById('stockVal');
  const stockItem = document.getElementById('stockItem');
  const fireBtn = document.getElementById('fireBtn');
  const resetBtn = document.getElementById('resetBtn');

  let stock = SEED_STOCK, cleared = 0, waved = 0;

  async function syncStock() {
    try {
      const res = await fetch(`/branches/${BRANCH_ID}/items/${ITEM_ID}/stock`);
      if (res.ok) {
        const data = await res.json();
        stock = data.quantity_available;
        updateReadout();
        if (stock === 0) closeSector(); else reopenSector();
      }
    } catch (e) {
      // page opened without the API reachable yet; keep the seed guess
    }
  }

  function updateReadout() {
    clearedVal.textContent = cleared;
    wavedVal.textContent = waved;
    stockVal.textContent = stock;
    stockItem.classList.toggle('alert', stock === 0);
  }

  function clearBlips() {
    scope.querySelectorAll('.ticket').forEach((b) => b.remove());
  }

  function spawnBlip(i) {
    const r = scope.clientWidth / 2 - 10;
    const angle = (i / N) * 2 * Math.PI + Math.random() * 0.15;
    const x0 = Math.cos(angle) * r, y0 = Math.sin(angle) * r;
    const x1 = Math.cos(angle) * (r + 40), y1 = Math.sin(angle) * (r + 40);
    const el = document.createElement('div');
    el.className = 'ticket inflight';
    el.style.setProperty('--x0', x0 + 'px');
    el.style.setProperty('--y0', y0 + 'px');
    el.style.setProperty('--x1', x1 + 'px');
    el.style.setProperty('--y1', y1 + 'px');
    el.style.transform = `translate(${x0}px, ${y0}px)`;
    el.style.transitionDelay = Math.random() * 80 + 'ms';
    scope.appendChild(el);
    return el;
  }

  function resolveBlip(el, ok) {
    el.classList.remove('inflight');
    el.classList.add('enter', ok ? 'fired' : 'eightysixed');
  }

  function pulseBeacon() {
    beacon.classList.remove('pulse');
    void beacon.offsetWidth;
    beacon.classList.add('pulse');
  }

  function closeSector() {
    beacon.classList.add('closed');
    sectorLabel.classList.add('show');
  }

  function reopenSector() {
    beacon.classList.remove('closed');
    sectorLabel.classList.remove('show');
  }

  async function fireOrder(i) {
    const el = spawnBlip(i);
    let ok = false;
    try {
      const res = await fetch(`/branches/${BRANCH_ID}/orders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: ITEM_ID, quantity: 1 }),
      });
      ok = res.ok;
      if (ok) {
        const data = await res.json();
        stock = data.remaining_stock;
      }
    } catch (e) {
      ok = false;
    }
    if (ok) {
      cleared++;
      pulseBeacon();
    } else {
      waved++;
    }
    resolveBlip(el, ok);
    updateReadout();
    if (stock === 0) closeSector();
  }

  fireBtn.addEventListener('click', async () => {
    fireBtn.disabled = true;
    clearBlips();
    cleared = 0;
    waved = 0;
    updateReadout();
    const requests = [];
    for (let i = 0; i < N; i++) requests.push(fireOrder(i));
    await Promise.all(requests);
    fireBtn.disabled = false;
  });

  resetBtn.addEventListener('click', async () => {
    resetBtn.disabled = true;
    await fetch('/admin/reset', { method: 'POST' });
    stock = SEED_STOCK;
    cleared = 0;
    waved = 0;
    clearBlips();
    reopenSector();
    updateReadout();
    resetBtn.disabled = false;
  });

  updateReadout();
  syncStock();
</script>
</body>
</html>
